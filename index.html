<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诸神传说 | Legends of the Gods</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #b8860b;
            --paper-dark: #2c1e14;
            --paper-light: #f4e4bc;
            --accent: #e2e8f0;
            --highlight: #d97706;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans CN', serif;
            background-color: #1a120b;
            color: var(--accent);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container { max-width: 1500px; margin: 0 auto; padding: 20px; }

        header { padding: 30px 0; text-align: center; }
        header h1 { 
            font-size: 3.5rem; 
            color: var(--paper-light); 
            letter-spacing: 12px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-weight: 800;
        }
        header h1 span {
            display: block;
            font-size: 1.5rem;
            letter-spacing: 6px;
            margin-top: 10px;
            color: var(--gold);
            font-weight: 300;
        }
        header p { opacity: 0.6; font-style: italic; margin-top: 15px; letter-spacing: 1px; font-size: 1rem; }

        .explorer-layout {
            display: grid;
            grid-template-columns: 1.7fr 1.2fr;
            gap: 25px;
            margin-top: 10px;
        }

        .map-wrapper {
            position: relative;
            background-image: url('https://thumbs.dreamstime.com/b/%E5%8F%A4%E8%91%A3%E4%B8%96%E7%95%8C%E5%9C%B0%E5%9C%BE%E8%AE%BE%E8%AE%A1%EF%BC%8C%E8%AE%A9%E4%BA%BA%E9%99%B6%E9%86%89%E7%9A%84%E6%8B%BC%E5%9B%BE%E4%BD%93%E9%AA%8C-365690160.jpg?w=992');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border-radius: 8px;
            border: 5px solid #3d2b1f;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            aspect-ratio: 992 / 558;
            overflow: hidden;
            position: sticky;
            top: 20px;
        }

        .pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ffd700;
            border: 1.5px solid #000;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: 0.3s;
            z-index: 10;
        }

        .pin::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #ffd700;
            animation: pulse 2.5s infinite;
        }

        .pin:hover, .pin.active {
            background: #fff;
            transform: translate(-50%, -50%) scale(2.5);
            box-shadow: 0 0 20px #fff;
            z-index: 20;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        .p-china    { top: 31%; left: 77.5%; }

        .p-iroquois { top: 34%; left: 24.5%; }

        /* 内容面板 */
        .detail-panel {
            background: #2d1e15;
            border-radius: 12px;
            padding: 40px;
            border: 2px solid #4a3225;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            height: calc(100vh - 150px);
            overflow-y: auto;
        }

        .legend-content h2 {
            color: #f4e4bc;
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-family: serif;
        }
        .legend-content .en-title {
            display: block;
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 20px;
            font-style: italic;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        .legend-meta {
            font-size: 0.9rem;
            color: #bbb;
            margin-bottom: 25px;
            display: flex;
            gap: 20px;
        }
        .legend-meta i { color: var(--gold); margin-right: 5px; }

        .section-title {
            color: var(--gold);
            font-weight: bold;
            margin-top: 30px;
            display: block;
            border-left: 5px solid var(--gold);
            padding-left: 12px;
            font-size: 1.2rem;
        }
        .section-title span {
            display: block;
            font-size: 0.85rem;
            font-style: italic;
            font-weight: normal;
            opacity: 0.7;

        }

        .legend-description {
            font-size: 1rem;
            color: #e2e8f0;
            white-space: pre-line;
            text-align: justify;
        }

        .en-text {
            display: block;
            font-size: 0.9rem;
            color: #94a3b8;
            font-style: italic;
            margin-top: 8px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .placeholder {
            text-align: center;
            opacity: 0.3;
            margin-top: 40%;
        }

        .detail-panel::-webkit-scrollbar { width: 6px; }
        .detail-panel::-webkit-scrollbar-thumb { background: #5d4037; border-radius: 10px; }

        @media (max-width: 1100px) {
            .explorer-layout { grid-template-columns: 1fr; }
            .map-wrapper { position: relative; top: 0; }
            .detail-panel { height: auto; }
        }
    </style>
</head>

    function showLegend(id, el) {
        document.querySelectorAll('.pin').forEach(p => p.classList.remove('active'));
        el.classList.add('active');

        const data = legendData[id];
        const placeholder = document.getElementById('placeholder');
        const content = document.getElementById('legendContent');

        placeholder.style.display = 'none';
        content.style.display = 'block';
        
        document.getElementById('title').innerText = data.title;
        document.getElementById('titleEn').innerText = data.titleEn;
        document.getElementById('region').innerHTML = "<i>" + data.region + "</i>";
        document.getElementById('era').innerHTML = "<i>" + data.era + "</i>";
        document.getElementById('description').innerHTML = data.description;
        
        content.style.animation = 'none';
        content.offsetHeight; 
        content.style.animation = 'fadeIn 0.6s forwards';
        
        document.getElementById('detailPanel').scrollTo({ top: 0, behavior: 'smooth' });
    }
