<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系探测档案 | Solar System Deep Atlas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --space-blue: #020617;
            --neon-blue: #38bdf8;
            --star-gold: #fbbf24;
            --text-gray: #cbd5e1;
            --panel-bg: rgba(15, 23, 42, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans SC', 'Poppins', sans-serif; 
            line-height: 1.6; 
            color: var(--text-gray); 
            background-color: var(--space-blue); 
            overflow: hidden;
        }

        /* 顶部导航 */
        header { 
            background-color: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            position: fixed; 
            width: 100%; 
            z-index: 1000; 
        }
        nav { 
            max-width: 1600px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 30px; 
        }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-icon { color: var(--neon-blue); font-size: 26px; margin-right: 12px; }
        .logo-text { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; }
        .logo-text span { color: var(--neon-blue); font-size: 14px; margin-left: 10px; }

        /* 主体布局 */
        .main-explorer {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 25px;
            padding: 100px 30px 30px;
            max-width: 1800px;
            margin: 0 auto;
            height: 100vh;
        }

        /* 宇宙星图区 */
        .map-container {
            position: relative;
            background-image: url('https://m1.aboluowang.com/uploadfile/2025/0531/20250531152456187.webp');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 20px;
            border: 2px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        /* 坐标点位 */
        .pin {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border: 3px solid var(--neon-blue);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .pin::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--neon-blue);
            animation: pulse 2.5s infinite;
        }
        .pin:hover, .pin.active {
            background: var(--star-gold);
            border-color: #fff;
            transform: translate(-50%, -50%) scale(1.6);
            box-shadow: 0 0 30px var(--star-gold);
            z-index: 100;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* --- 严格确定的精准坐标 (L/T) --- */
        .p-sun      { top: 50%; left: 4%; }
        .p-mercury  { top: 50%; left: 10%; }
        .p-venus    { top: 50%; left: 17%; }
        .p-earth    { top: 50%; left: 25%; }
        .p-moon     { top: 40%; left: 25%; }
        .p-mars     { top: 50%; left: 32%; }
        .p-jupiter  { top: 50%; left: 45%; }
        .p-saturn   { top: 50%; left: 65%; }
        .p-uranus   { top: 50%; left: 80%; }
        .p-neptune  { top: 50%; left: 92%; }
        .p-pluto    { top: 50%; left: 100%; }

        /* 详情面板 */
        .info-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .astro-header { 
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3); 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        .astro-header-text h2 { font-size: 36px; color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .astro-header-text h3 { font-size: 18px; color: var(--neon-blue); font-weight: 400; font-style: italic; }
        
        .astro-thumbnail-container {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid var(--neon-blue);
            cursor: zoom-in;
            background: #000;
        }
        .astro-thumbnail {
            width: 120px; height: 120px;
            object-fit: cover; display: block; transition: 0.5s;
        }

        .content-section { margin-bottom: 25px; }
        .content-section h4 { 
            color: var(--star-gold); 
            margin-bottom: 8px; 
            border-left: 5px solid var(--neon-blue); 
            padding-left: 12px; 
            font-size: 1.1rem;
        }
        .content-section p { font-size: 16px; color: #e2e8f0; text-align: justify; }
        .en-text { display: block; font-size: 14px; color: #94a3b8; font-style: italic; margin-top: 8px; line-height: 1.4; }

        .placeholder { text-align: center; margin-top: 40%; opacity: 0.5; }

        #imgModal {
            display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); justify-content: center; align-items: center; cursor: zoom-out;
        }
        #imgModal img { max-width: 90%; max-height: 90%; border: 2px solid var(--neon-blue); box-shadow: 0 0 50px var(--neon-blue); }

        .info-panel::-webkit-scrollbar { width: 5px; }
        .info-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        @media (max-width: 1024px) {
            .main-explorer { grid-template-columns: 1fr; height: auto; }
            .map-container { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fas fa-atom"></i></div>
                <div class="logo-text">太阳系探测档案 <span>Solar System Deep Archives</span></div>
            </a>
            <div style="font-size: 14px; color: var(--neon-blue); font-family: 'Orbitron';">Mission Status: Deep Space Analysis</div>
        </nav>
    </header>

    <main class="main-explorer">
        <div class="map-container">
            <!-- 严格坐标点位 -->
            <div class="pin p-sun" onclick="showAstro('sun', this)"></div>
            <div class="pin p-mercury" onclick="showAstro('mercury', this)"></div>
            <div class="pin p-venus" onclick="showAstro('venus', this)"></div>
            <div class="pin p-earth" onclick="showAstro('earth', this)"></div>
            <div class="pin p-moon" onclick="showAstro('moon', this)"></div>
            <div class="pin p-mars" onclick="showAstro('mars', this)"></div>
            <div class="pin p-jupiter" onclick="showAstro('jupiter', this)"></div>
            <div class="pin p-saturn" onclick="showAstro('saturn', this)"></div>
            <div class="pin p-uranus" onclick="showAstro('uranus', this)"></div>
            <div class="pin p-neptune" onclick="showAstro('neptune', this)"></div>
            <div class="pin p-pluto" onclick="showAstro('pluto', this)"></div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="placeholder" id="placeholder">
                <i class="fas fa-satellite-dish fa-4x" style="color:var(--neon-blue); margin-bottom:20px"></i>
                <p>正在接收星际信号... 请点击目标解锁档案<br><i>Waiting for signal... Select a celestial body.</i></p>
            </div>
            <div id="astroDetail" style="display:none">
                <div class="astro-header">
                    <div class="astro-header-text">
                        <h2 id="aName"></h2>
                        <h3 id="aEnName"></h3>
                    </div>
                    <div class="astro-thumbnail-container" onclick="zoomImage()">
                        <!-- 增加了 referrerpolicy 以确保维基百科链接加载正常 -->
                        <img id="aImg" src="" alt="Celestial" class="astro-thumbnail" referrerpolicy="no-referrer">
                    </div>
                </div>
                <div class="astro-content">
                    <div class="content-section">
                        <h4>观测数据 / Parameters</h4>
                        <p id="aData"></p>
                        <span class="en-text" id="aDataEn"></span>
                    </div>
                    <div class="content-section">
                        <h4>核心档案 / Deep Archive</h4>
                        <p id="aDesc"></p>
                        <span class="en-text" id="aDescEn"></span>
                    </div>
                    <div class="content-section">
                        <h4>科学与文化意义 / Significance</h4>
                        <p id="aValue"></p>
                        <span class="en-text" id="aValueEn"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="imgModal" onclick="this.style.display='none'">
        <img id="modalImg" src="" referrerpolicy="no-referrer">
    </div>

    <script>
        const astroData = {
            sun: {
                name: "太阳", en: "The Sun",
                img: "https://images.unsplash.com/photo-1529788295308-1eace6f67388?auto=format&fit=crop&w=300&q=80",
                data: "核心温度：1570万K | 质量：占太阳系 99.86%",
                dataEn: "Core Temp: 15.7M K | Mass: 99.86% of Solar System",
                desc: "太阳系中心的唯一恒星。其核心通过氢核聚变释放能量，是生命之源。",
                descEn: "The sole star at our center. Its core fuses hydrogen into helium, releasing energy.",
                value: "重力锚点。它不仅提供能量，更决定了行星的轨道秩序。",
                valueEn: "The gravitational anchor and primary energy source."
            },
            mercury: {
                name: "水星", en: "Mercury",
                img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=300&q=80",
                data: "公转周期：88天 | 昼夜温差冠绝全系",
                dataEn: "Orbit: 88 Days | Highest temp fluctuations",

                descEn: "The smallest planet. Lacking atmosphere, its surface is heavily cratered.",
                value: "行星演化的活化石。通过它了解内太阳系的原始状态。",
                valueEn: "Crucial for understanding early planetary formation."
            },
            venus: {
                name: "金星", en: "Venus",
                img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=300&q=80",
                data: "表面压力：92倍地球 | 表面温度：462℃",
                dataEn: "Pressure: 92 bar | Surface Temp: 462°C",
                desc: "拥有极浓厚的二氧化碳大气层，失控的温室效应使其成为地狱。",
                descEn: "Earth's twin with a runaway greenhouse effect and a crushing atmosphere.",
                value: "气候研究的警示灯。极端温室效应的典型案例参考。",
                valueEn: "A planetary warning for extreme climate change."
            },
            earth: {
                name: "地球", en: "Earth",
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/Nasa_blue_marble.jpg/960px-Nasa_blue_marble.jpg",
                data: "表面覆盖：71% 液态水 | 唯一已知生命星球",
                dataEn: "Surface: 71% Water | Only known life-bearing planet",
                desc: "完美的磁场、含氧大气和丰富的液态水，构成了生命避风港。",
                descEn: "Oxygen-rich air, magnetic protection, and liquid water sustain life.",
                value: "文明的家园。人类在浩瀚宇宙中唯一的母星。",
                valueEn: "The cradle of civilization and our only home."
            },
            moon: {
                name: "月球", en: "The Moon",
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Full_Moon_Luc_Viatour.jpg/960px-Full_Moon_Luc_Viatour.jpg",
                data: "距离地球：38.4万公里 | 自转：受潮汐锁定",
                dataEn: "Distance: 384,400km | Rotation: Tidally Locked",
                desc: "地球唯一的天然卫星。它稳定了地轴偏角，引起海洋潮汐。",
                descEn: "Our only natural satellite. It stabilizes Earth's tilt and controls tides.",
                value: "深空前哨。人类第一个登陆的地外星球，未来的深空跳板。",
                valueEn: "The lunar outpost. The first extraterrestrial world walked upon by humans."
            },
            mars: {
                name: "火星", en: "Mars",
                img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=300&q=80",
                data: "最高山峰：奥林匹斯山 | 探测器数量：全系最多",
                dataEn: "Highest Peak: Olympus Mons | Most Explored Planet",
                desc: "红色荒漠世界。科学界认为其过去曾拥有温暖湿润的环境。",
                descEn: "A red desert world. Evidence suggests liquid water flowed in its past.",
                value: "第二家园。寻找地外生命和建立星际移民的核心目标。",
                valueEn: "The prime target for future human colonization."
            },
            jupiter: {
                name: "木星", en: "Jupiter",
                img: "https://images.unsplash.com/photo-1630839437035-dac17da580d0?auto=format&fit=crop&w=300&q=80",
                data: "卫星数量：95颗 | 大红斑：持续300余年的风暴",
                dataEn: "Moons: 95 | Great Red Spot: 300+ year storm",
                desc: "巨大的引力清理了威胁天体。大红斑是比地球还大的风暴。",
                descEn: "The solar system's vacuum cleaner, protecting the inner planets.",
                value: "众神之王。木卫二被认为存在地下海洋生命。",
                valueEn: "The King of Gods; its moon Europa may harbor life."
            },
            saturn: {
                name: "土星", en: "Saturn",
                img: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?auto=format&fit=crop&w=300&q=80",
                data: "光环跨度：28万公里 | 平均密度：小于水",
                dataEn: "Ring Width: 280,000km | Density: Less than water",
                desc: "以宏伟的光环闻名。最扁平的行星，由氢和氦组成。",
                descEn: "Famous for its magnificent icy rings. A gas giant mostly made of hydrogen.",
                value: "空间美学极致。光环研究对理解行星形成至关重要。",
                valueEn: "A masterpiece of mechanics and planetary evolution."
            },
            uranus: {
                name: "天王星", en: "Uranus",
                img: "https://images.unsplash.com/photo-1614732484003-ef9881555dc3?auto=format&fit=crop&w=300&q=80",
                data: "轴倾角：98度 | 表面温度：最低 -224℃",
                dataEn: "Axial Tilt: 98° | Temp: Lowest -224°C",
                desc: "蔚蓝色冰巨星。轴倾角过大使其仿佛在轨道上侧躺滚动。",
                descEn: "A blue ice giant that rolls along its orbit on its side.",
                value: "倾斜的异类。其磁场挑战理论，是研究远日行星的关键。",
                valueEn: "A vital subject for studying outer planetary systems."
            },
            neptune: {
                name: "海王星", en: "Neptune",
                img: "https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?auto=format&fit=crop&w=300&q=80",
                data: "最高风速：2100km/h | 发现方式：数学推算",
                dataEn: "Wind Speed: 2,100km/h | Found via Calculation",
                desc: "深蓝色星球。拥有全系风速最高、最活跃的大气环流。",
                descEn: "The deep blue world. Home to the strongest supersonic winds.",
                value: "数学逻辑的胜利。第一个未经观测先计算出的行星。",
                valueEn: "First planet discovered via math rather than observation."
            },
            pluto: {
                name: "冥王星", en: "Pluto",
                img: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a7/Pluto-01_Stern_03_Pluto_Color_TXT.jpg/960px-Pluto-01_Stern_03_Pluto_Color_TXT.jpg",
                data: "分类：矮行星 | 地貌：拥有巨大心形冰原",
                dataEn: "Class: Dwarf Planet | Feature: Heart-shaped ice plains",
                desc: "位于柯伊伯带。2015年新视野号揭示了它表面惊人的复杂地理。",
                descEn: "Located in the Kuiper Belt. Features complex nitrogen-ice mountains.",
                value: "冥界之王。理解外太阳系及边缘天体演化的窗口。",
                valueEn: "A window into the evolution of icy Kuiper Belt objects."
            }
        };

        let currentActivePin = null;

        function showAstro(id, el) {
            if (currentActivePin) currentActivePin.classList.remove('active');
            el.classList.add('active');
            currentActivePin = el;

            const data = astroData[id];
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('astroDetail').style.display = 'block';
            
            document.getElementById('aName').innerText = data.name;
            document.getElementById('aEnName').innerText = data.en;
            document.getElementById('aImg').src = data.img;
            document.getElementById('aData').innerText = data.data;
            document.getElementById('aDataEn').innerText = data.dataEn;
            document.getElementById('aDesc').innerText = data.desc;
            document.getElementById('aDescEn').innerText = data.descEn;
            document.getElementById('aValue').innerText = data.value;
            document.getElementById('aValueEn').innerText = data.valueEn;

            const detail = document.getElementById('astroDetail');
            detail.style.opacity = 0;
            setTimeout(() => {
                detail.style.transition = '0.5s ease';
                detail.style.opacity = 1;
            }, 10);
        }

        function zoomImage() {
            const imgSrc = document.getElementById('aImg').src;
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.style.display = 'flex';
        }
    </script>
</body>
</html>
