    <style>
        :root {
            --primary-color: #064e3b; 
            --accent-color: #fbbf24;  
            --bg-color: #1a120b;
            --panel-bg: #ffffff;
            --gold: #b8860b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans SC', 'Poppins', sans-serif; 
            line-height: 1.6; 
            color: #334155; 
            background-color: var(--bg-color); 
            overflow: hidden;
        }

        header { 
            background-color: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            box-shadow: 0 2px 20px rgba(0,0,0,0.5); 
            position: fixed; 
            width: 100%; 
            z-index: 1000; 
        }
        nav { 
            max-width: 1600px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 30px; 
        }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-icon { color: var(--primary-color); font-size: 26px; margin-right: 12px; }
        .logo-text { font-size: 24px; font-weight: 700; color: var(--primary-color); }
        .logo-text span { color: var(--gold); font-weight: 400; font-size: 14px; margin-left: 10px; border-left: 1px solid #ccc; padding-left: 10px; }

        .main-explorer {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 25px;
            padding: 100px 30px 30px;
            max-width: 1800px;
            margin: 0 auto;
            height: 100vh;
        }

        .map-container {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            border-radius: 15px;
            border: 8px solid #fff;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        .pin {
            position: absolute;
            width: 16px;
            height: 16px;
            background: var(--accent-color);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: 0.3s;
        }
        .pin::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--accent-color);
            animation: pulse 2.5s infinite;
        }
        .pin:hover, .pin.active {
            background: white;
            transform: translate(-50%, -50%) scale(2.2);
            box-shadow: 0 0 20px var(--accent-color);
            z-index: 100;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* 木纹地图精准坐标对齐 */
        .p-durian    { top: 58%; left: 76%; } 
        .p-mangosteen{ top: 64%; left: 79%; } 
        .p-lychee    { top: 40%; left: 77%; } 
        .p-persimmon { top: 38%; left: 86%; } 
        .p-mango     { top: 52%; left: 71%; } 
        .p-kiwi      { top: 84%; left: 90%; } 
        .p-avocado   { top: 52%; left: 19%; } 
        .p-pineapple { top: 74%; left: 29%; } 
        .p-blueberry { top: 22%; left: 16%; } 
        .p-cranberry { top: 28%; left: 22%; } 
        .p-olive     { top: 37%; left: 49%; } 
        .p-lemon     { top: 34%; left: 53%; } 
        .p-grape     { top: 28%; left: 47%; } 
        .p-apple     { top: 31%; left: 64%; } 
        .p-date      { top: 48%; left: 60%; } 
        .p-watermelon{ top: 80%; left: 56%; } 
        .p-banana    { top: 60%; left: 46%; } 
        .p-fig       { top: 39%; left: 43%; } 
        .p-acai      { top: 66%; left: 34%; } 
        .p-pitaya    { top: 56%; left: 74%; } 

        .info-panel {
            background: var(--panel-bg);
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid #e2e8f0;
            overflow-y: auto;
        }

        .fruit-header { 
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #f1f5f9; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        .fruit-header-text h2 { font-size: 32px; color: var(--primary-color); margin-bottom: 5px; }
        .fruit-header-text h3 { font-size: 16px; color: #94a3b8; font-weight: 400; font-style: italic; }
        
        .fruit-thumbnail-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: zoom-in;
            background-color: #f1f5f9;
        }
        .fruit-thumbnail {
            width: 150px;
            height: 110px;
            object-fit: cover;
            display: block;
            transition: 0.4s;
        }
        .thumbnail-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            color: white;
            font-size: 20px;
        }
        .fruit-thumbnail-container:hover .thumbnail-overlay { opacity: 1; }

        .content-section { margin-bottom: 25px; }
        .content-section h4 { 
            color: var(--primary-color); 
            margin-bottom: 8px; 
            border-left: 5px solid var(--accent-color); 
            padding-left: 12px; 
            font-size: 1.1rem;
        }
        .content-section p { font-size: 16px; color: #334155; text-align: justify; }
        .en-text { display: block; font-size: 14px; color: #94a3b8; font-style: italic; margin-top: 6px; line-height: 1.4; }

        .placeholder { text-align: center; margin-top: 40%; opacity: 0.4; }

        #imgModal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #imgModal img { 
            max-width: 85%; 
            max-height: 85%; 
            border-radius: 10px; 
            border: 5px solid white;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        @media (max-width: 1024px) {
            .main-explorer { grid-template-columns: 1fr; height: auto; }
            .map-container { aspect-ratio: 16/9; }
        }
    </style>
</head>

        let currentActivePin = null;

        function showFruit(id, el) {
            if (currentActivePin) currentActivePin.classList.remove('active');
            el.classList.add('active');
            currentActivePin = el;

            const data = fruitData[id];
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('fruitDetail').style.display = 'block';
            
            document.getElementById('fName').innerText = data.name;
            document.getElementById('fEnName').innerText = data.en;
            document.getElementById('fImg').src = data.img;
            document.getElementById('fOrigin').innerText = data.origin;
            document.getElementById('fOriginEn').innerText = data.originEn;
            document.getElementById('fDesc').innerText = data.desc;
            document.getElementById('fDescEn').innerText = data.descEn;
            document.getElementById('fValue').innerText = data.value;
            document.getElementById('fValueEn').innerText = data.valueEn;

            const detail = document.getElementById('fruitDetail');
            detail.style.opacity = 0;
            setTimeout(() => {
                detail.style.transition = '0.5s ease';
                detail.style.opacity = 1;
            }, 10);
        }

        function zoomImage() {
            const imgSrc = document.getElementById('fImg').src;
            if(!imgSrc) return;
            const modal = document.getElementById('imgModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.style.display = 'flex';
        }
    </script>
