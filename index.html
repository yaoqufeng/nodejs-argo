<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI大模型图鉴 | Global AI Model Atlas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ai-blue: #0ea5e9;
            --ai-purple: #a855f7;
            --tech-cyan: #22d3ee;
            --bg-dark: #020617;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --text-main: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            line-height: 1.6; 
            color: var(--text-main); 
            background-color: var(--bg-dark); 
            overflow: hidden;
        }

        /* 顶部导航 */
        header { 
            background-color: rgba(2, 6, 23, 0.8); 
            backdrop-filter: blur(15px); 
            border-bottom: 1px solid rgba(14, 165, 233, 0.3);
            position: fixed; width: 100%; z-index: 1000; 
        }
        nav { 
            max-width: 1600px; margin: 0 auto; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 30px; 
        }
        .logo { display: flex; align-items: center; text-decoration: none; }
        .logo-icon { color: var(--ai-blue); font-size: 28px; margin-right: 12px; }
        .logo-text { font-size: 24px; font-weight: 700; color: #fff; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .logo-text span { color: var(--ai-blue); font-size: 14px; margin-left: 10px; opacity: 0.8; }

        /* 主体布局 */
        .main-explorer {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 25px;
            padding: 100px 30px 30px;
            max-width: 1800px; margin: 0 auto;
            height: 100vh;
        }

        /* 地图显示区 */
        .map-container {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1200&auto=format&fit=crop'); /* 科技感地球底图 */
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            border: 2px solid rgba(14, 165, 233, 0.4);
            box-shadow: 0 0 50px rgba(0,0,0,1), inset 0 0 100px rgba(14, 165, 233, 0.1);
            overflow: hidden;
        }
        .map-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.4); pointer-events: none;
        }

        /* 坐标光点 */
        .pin {
            position: absolute;
            width: 20px; height: 20px;
            background: #fff;
            border: 4px solid var(--ai-blue);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: 0.3s;
            box-shadow: 0 0 20px var(--ai-blue);
        }
        .pin::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border-radius: 50%; background: var(--ai-blue);
            animation: pulse 2.5s infinite;
        }
        .pin:hover, .pin.active {
            background: var(--tech-cyan);
            border-color: #fff;
            transform: translate(-50%, -50%) scale(1.5);
            box-shadow: 0 0 35px var(--tech-cyan);
            z-index: 100;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(4); opacity: 0; }
        }

        /* 各国坐标点位 (适配底图) */
        .p-usa    { top: 38%; left: 18%; }
        .p-china  { top: 42%; left: 78%; }
        .p-france { top: 32%; left: 48%; }
        .p-uae    { top: 48%; left: 58%; }
        .p-uk     { top: 28%; left: 46%; }
        .p-korea  { top: 42%; left: 85%; }
        .p-canada { top: 28%; left: 15%; }

        /* 详情面板 */
        .info-panel {
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(14, 165, 233, 0.2);
            overflow-y: auto;
            backdrop-filter: blur(15px);
        }

        .ai-header { 
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px solid rgba(14, 165, 233, 0.3); 
            padding-bottom: 20px; margin-bottom: 25px; 
        }
        .ai-header-text h2 { font-size: 32px; color: #fff; font-family: 'Orbitron', sans-serif; }
        .ai-header-text h3 { font-size: 16px; color: var(--ai-blue); font-weight: 400; font-style: italic; }
        
        .ai-thumbnail {
            width: 100px; height: 100px;
            border-radius: 15px; border: 2px solid var(--ai-blue);
            object-fit: cover;
        }

        .content-section { margin-bottom: 25px; }
        .content-section h4 { 
            color: var(--tech-cyan); margin-bottom: 8px; 
            border-left: 5px solid var(--ai-blue); padding-left: 12px; 
            font-size: 1.1rem; text-transform: uppercase;
        }
        .content-section p { font-size: 16px; color: #e2e8f0; text-align: justify; margin-bottom: 10px; }
        .en-text { display: block; font-size: 14px; color: #94a3b8; font-style: italic; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 5px; }

        .placeholder { text-align: center; margin-top: 40%; opacity: 0.5; }
        .placeholder i { font-size: 50px; color: var(--ai-blue); margin-bottom: 20px; }

        .info-panel::-webkit-scrollbar { width: 5px; }
        .info-panel::-webkit-scrollbar-thumb { background: var(--ai-blue); border-radius: 10px; }

        @media (max-width: 1024px) {
            .main-explorer { grid-template-columns: 1fr; height: auto; }
            .map-container { height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <div class="logo-icon"><i class="fas fa-brain"></i></div>
                <div class="logo-text">AI大模型图鉴 <span>Global Model Atlas</span></div>
            </a>
            <div style="font-size: 14px; color: var(--ai-blue); font-family: 'Orbitron';">INTELLIGENCE STATUS: EVOLVING</div>
        </nav>
    </header>

    <main class="main-explorer">
        <div class="map-container">
            <!-- 产地光点 -->
            <div class="pin p-usa" onclick="showAI('usa', this)"></div>
            <div class="pin p-china" onclick="showAI('china', this)"></div>
            <div class="pin p-france" onclick="showAI('france', this)"></div>
            <div class="pin p-uae" onclick="showAI('uae', this)"></div>
            <div class="pin p-uk" onclick="showAI('uk', this)"></div>
            <div class="pin p-korea" onclick="showAI('korea', this)"></div>
            <div class="pin p-canada" onclick="showAI('canada', this)"></div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="placeholder" id="placeholder">
                <i class="fas fa-microchip"></i>
                <p>点击全球AI枢纽点位获取深度档案<br><i>Click satellite points to retrieve AI intelligence reports</i></p>
            </div>
            <div id="aiDetail" style="display:none">
                <div class="ai-header">
                    <div class="ai-header-text">
                        <h2 id="aCountry"></h2>
                        <h3 id="aEnCountry"></h3>
                    </div>
                    <img id="aImg" src="" alt="AI Tech" class="ai-thumbnail">
                </div>
                <div class="ai-content">
                    <div class="content-section">
                        <h4>核心大模型 / Core LLMs</h4>
                        <p id="aModels" style="color: var(--tech-cyan); font-weight: bold; font-family: 'Orbitron';"></p>
                    </div>
                    <div class="content-section">
                        <h4>技术特点 / Technical Profile</h4>
                        <p id="aDesc"></p>
                        <span class="en-text" id="aDescEn"></span>
                    </div>
                    <div class="content-section">
                        <h4>产业格局 / Industrial Landscape</h4>
                        <p id="aValue"></p>
                        <span class="en-text" id="aValueEn"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const aiData = {
            usa: {
                country: "美国", en: "United States - Global AI Epicenter",
                img: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=400",
                models: "GPT-4 (OpenAI), Gemini (Google), Claude (Anthropic), Llama 3 (Meta)",
                desc: "美国是全球AI浪潮的引领者，拥有最完善的生态系统和最强大的算力支撑。其模型在逻辑推理、多模态处理和长文本理解方面处于世界顶尖水平。",
                descEn: "The US leads the global AI wave, boasting the most mature ecosystem and computational support. Its models excel in logical reasoning, multimodal processing, and long-context understanding.",
                value: "以硅谷为中心，汇聚了从闭源商业模型（OpenAI）到开源生态（Meta）的所有顶尖路径，定义了通用人工智能（AGI）的技术标准。",
                valueEn: "Centered in Silicon Valley, it converges all top paths from closed-source commercial models to open-source ecosystems, defining technical standards for AGI."
            },
            china: {
                country: "中国", en: "China - AI Innovation Powerhouse",
                img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400",
                models: "DeepSeek-V3, Ernie Bot (Baidu), Qwen (Alibaba), GLM (Zhipu AI)",
                desc: "中国拥有全球第二大模型群。特别是在模型推理效率（如DeepSeek）和垂直行业应用方面展现出极强的竞争力。中文语境处理能力世界第一。",
                descEn: "China hosts the world's second-largest group of LLMs, showing high competitiveness in inference efficiency (e.g., DeepSeek) and vertical industrial applications. It leads the world in Chinese linguistic processing.",
                value: "呈现“百模大战”态势，互联网巨头与独角兽公司并进，在AI赋能制造业、金融和政务领域具有独特的数据规模优势。",
                valueEn: "Characterized by the 'War of a Hundred Models,' where tech giants and unicorns advance together, leveraging massive data advantages in manufacturing, finance, and governance."
            },
            france: {
                country: "法国", en: "France - Europe's AI Rising Star",
                img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400",
                models: "Mistral, Mixtral (Mistral AI), Bloom (Hugging Face)",
                desc: "法国已成为欧洲AI研究的中心。Mistral AI凭借其高效的稀疏混合专家（MoE）架构，在开源界和模型效能比上赢得了全球声誉。",
                descEn: "France has emerged as Europe's hub for AI research. Mistral AI gained global acclaim for its efficient Mixture-of-Experts (MoE) architecture and high performance-to-cost ratio.",
                value: "强调主权AI与开源透明，在欧盟AI法案框架下，积极推动独立于美国技术的欧洲路径。",
                valueEn: "Emphasizes sovereign AI and open-source transparency, actively pushing for a European path independent of US technology under the EU AI Act framework."
            },
            uae: {
                country: "阿联酋", en: "UAE - The Desert's Digital Intelligence",
                img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=400",
                models: "Falcon (TII), Jais (G42)",
                desc: "阿联酋通过国家级投入，由技术创新研究院（TII）开发的Falcon系列一度登顶全球开源模型榜单。Jais是全球性能最强的阿拉伯语大模型。",
                descEn: "Through state-level investment, the UAE's Falcon series developed by TII topped global open-source leaderboards. Jais is the world's highest-performing Arabic LLM.",
                value: "展现了中东地区从能源经济向AI驱动转型的决心，致力于打造跨语言、跨文化的区域性智能中枢。",
                valueEn: "Demonstrates the Middle East's resolve to pivot from an energy economy to an AI-driven one, aiming to build a regional intelligence hub."
            },
            uk: {
                country: "英国", en: "United Kingdom - The Scientific Cradle",
                img: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=400",
                models: "Gemini (DeepMind-UK Origin), Stable Diffusion (Stability AI)",
                desc: "虽然DeepMind已被谷歌收购，但其总部仍在伦敦。英国在模型底层的算法逻辑（如强化学习）和生成式扩散模型方面有极深积累。",
                descEn: "While DeepMind is now part of Google, its HQ remains in London. The UK has deep expertise in underlying algorithms (like Reinforcement Learning) and generative diffusion models.",
                value: "依托牛津、剑桥等顶尖学术背景，英国在AI安全监管和前沿科研（如DeepMind的蛋白质折叠预测）领域全球领先。",
                valueEn: "Relying on Oxford and Cambridge, the UK leads globally in AI safety regulation and cutting-edge research like DeepMind's protein folding predictions."
            },
            korea: {
                country: "韩国", en: "South Korea - Hyper-Localized AI",
                img: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=400",
                models: "HyperCLOVA X (Naver), Exaone (LG)",
                desc: "韩国在高度本地化的AI应用上极具特色。Naver开发的HyperCLOVA X深入理解韩国文化、法律与社交语境，并在硬件算力上与三星紧密结合。",
                descEn: "South Korea excels in highly localized AI applications. Naver's HyperCLOVA X deeply understands Korean culture, law, and social context, integrating tightly with Samsung hardware.",
                value: "拥有从半导体芯片（HBM内存）到模型层再到应用层的完整垂直产业链，是全球AI硬件生态的关键一环。",
                valueEn: "With a complete vertical chain from chips (HBM memory) to models and applications, it is a key link in the global AI hardware ecosystem."
            },
            canada: {
                country: "加拿大", en: "Canada - Deep Learning Birthplace",
                img: "https://images.unsplash.com/photo-1503614472-8c93d56e92ce?w=400",
                models: "Command (Cohere)",
                desc: "作为“深度学习教父”们成名的地方，加拿大在AI人才储备和底层框架上贡献巨大。Cohere专注于为企业提供高性能、可定制的对话式AI。",
                descEn: "As the birthplace of the 'Godfathers of Deep Learning,' Canada contributes massively to AI talent and core frameworks. Cohere focuses on customizable conversational AI for enterprise.",
                value: "虽然商业化规模略逊于美国，但在AI伦理、基础科研和B端企业级应用方面保持着独特的学术高度。",
                valueEn: "While its commercial scale is smaller than the US, it maintains a unique academic height in AI ethics, basic research, and B2B enterprise applications."
            }
        };

        let currentActivePin = null;

        function showAI(id, el) {
            // 更新 Pin 样式
            if (currentActivePin) currentActivePin.classList.remove('active');
            el.classList.add('active');
            currentActivePin = el;

            const data = aiData[id];
            
            // 更新内容
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('aiDetail').style.display = 'block';
            
            document.getElementById('aCountry').innerText = data.country;
            document.getElementById('aEnCountry').innerText = data.en;
            document.getElementById('aImg').src = data.img;
            document.getElementById('aModels').innerText = data.models;
            document.getElementById('aDesc').innerText = data.desc;
            document.getElementById('aDescEn').innerText = data.descEn;
            document.getElementById('aValue').innerText = data.value;
            document.getElementById('aValueEn').innerText = data.valueEn;

            // 简单淡入动画
            const detail = document.getElementById('aiDetail');
            detail.style.opacity = 0;
            detail.style.transform = "translateX(20px)";
            setTimeout(() => {
                detail.style.transition = '0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                detail.style.opacity = 1;
                detail.style.transform = "translateX(0)";
            }, 10);
            
            document.getElementById('infoPanel').scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
